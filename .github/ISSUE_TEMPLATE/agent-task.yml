name: Agent task (handoff)
description: A bounded task for Cursor, ChatGPT or Claude. The issue is the spec; the pull request is the work. See AGENTS.md, "Working with other agents".
title: "[agent] <one line>"
labels: ["handoff"]
body:
  - type: dropdown
    id: agent
    attributes:
      label: Taking agent
      description: Also add the matching `agent:*` label. One agent per issue.
      options: ["cursor", "chatgpt", "claude"]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when this is done, in one or two sentences. Cite the kernel, document or claim it touches.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements. A reviewer must be able to tick each one from the pull request alone.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence required
      description: Tests that must exist and pass (GPU suites on the named hardware for kernel changes); receipts that must be in the repository before a number is quoted.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      value: |
        - No gate, threshold, kernel-default or registered-claim change in this task; stop and say so on the issue if one is needed.
        - Code and receipts in separate pull requests; the pull request cites this issue and stops short of merging.
        - Run the repository's check scripts before opening the pull request; ship the companions they name in the same diff.
        - No credentials in the issue, the pull request or Slack.
  - type: input
    id: handoff
    attributes:
      label: Handoff thread
      description: Link to the `HANDOFF →` message in #ml-packages, if one exists.
