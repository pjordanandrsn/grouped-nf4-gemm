name: ci

# Device-free gates that guard the contract on every push/PR — no GPU runner
# needed. The 44-test GPU property suite + the blind confirmatories remain the
# hardware-side gates (run manually on rented/home silicon); these two jobs
# make the parts that CAN run on free runners run automatically, so an external
# contributor or confirmatory-filer can't silently break the contract or the
# projection anchors.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  anchor-gate:
    # R1: the projection model must reproduce the published flagship rows.
    # Pure stdlib — no torch/triton — so it's fast and can never bit-rot silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: projection anchor gate
        run: cd projections && python test_anchors.py

  example-runs:
    # D6: examples/dequant_tax.py is the one file a stranger executes. If it
    # drifts from the API it stops being that, silently — the way the README's
    # decision tree once did. This exercises the CPU path (no GPU on the runner),
    # which must print its requirements and exit 0 rather than traceback, and
    # asserts the file stays under the 150-line rail that keeps it readable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install CPU torch
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch numpy --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: example executes and exits clean without a GPU
        run: |
          out=$(python examples/dequant_tax.py)
          echo "$out"
          echo "$out" | grep -q "No CUDA device" || { echo "expected the CPU notice"; exit 1; }
          echo "$out" | grep -q "dequant_ref" || { echo "CPU path must name the checkable oracle"; exit 1; }
          python examples/dequant_tax.py --help > /dev/null
      - name: solution-page CPU-only python blocks execute (cwd kernel/, CPU torch)
        # The blocks whose first line is `# CPU-only` promise to run without a
        # GPU or triton; this holds them to it on the same CPU-torch runner.
        run: python scripts/check_docs_examples.py --root . --run-cpu-blocks kernel
      - name: still one readable file
        run: |
          n=$(wc -l < examples/dequant_tax.py)
          echo "$n lines"
          [ "$n" -lt 150 ] || { echo "examples/dequant_tax.py grew past the 150-line rail"; exit 1; }

  interp-contract:
    # Triton interpreter-mode (CPU) contract + fuzz suite: kernel SEMANTICS,
    # nibble order, boundary/adversarial shapes — validated with no GPU and no
    # bitsandbytes (pure-torch NF4 packer as fixture oracle).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install CPU torch + triton
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet triton pytest numpy

      # The interpreter suites `importorskip("triton")` -- correct on macOS,
      # where there is no triton wheel at all, but it means a BROKEN install
      # above would turn them into silent skips and this job would stay green
      # about nothing. Same rule the GGUF step states in as many words. Assert
      # the dependency is really here, so a skip can only ever mean "platform
      # without triton", never "CI stopped testing this".
      - name: triton is actually installed (a skip here must never be silent)
        run: python -c "import triton; print('triton', triton.__version__)"

      - name: interpreter-mode contract + fuzz
        env:
          TRITON_INTERPRET: "1"
        run: cd kernel && python -m pytest test_interp_contract.py test_gemv_vec_loads.py test_group_tiles_device.py test_int4_b32.py -q

      - name: README CPU quickstart (executed) + CPU refusal guard
        run: cd kernel && python -m pytest test_readme_cpu_block.py test_cpu_refusal.py test_decode_anchor.py -q

      # NVMe arena format + both bake modes, and the segment_into staging seam.
      # Pure CPU, no device, no GPU: tmpfile arenas, injected quantizer, hash
      # comparisons. These shipped with the arena format but nothing in CI ran
      # them — a green check that was green about other code.
      - name: NVMe arena + bake contracts
        run: cd kernel && python -m pytest test_nvme_arena.py test_nvme_bake_nf4.py test_nvme_bake_experts.py test_nvme_segment_into.py test_nvme_qd.py test_nvme_absmax_bf16.py test_arena_fetch_amplification.py test_arena_scatter.py -q

      # GGUF k-quant lane: oracle adjudication vs gguf-py (installed here so
      # the oracle arm RUNS in CI — importorskip must never silently green
      # this suite). Real-byte fixture arm stays env-gated/off in CI.
      - name: GGUF k-quant oracle
        run: |
          python -m pip install --quiet gguf
          cd kernel && python -m pytest test_kquant_ref.py -q

      # Packaging + CI coverage. 0.3.0 shipped a CHANGELOG announcing two modules
      # that were not in py-modules and therefore not in the wheel. This also
      # asserts every kernel/test_*.py is named somewhere in THIS file -- the
      # step that would otherwise let the next guard be added and never run.
      # These 8 were in the tree and invoked by nothing. They need triton (which
      # this job installs) but not a device, so CPU CI can run them.
      - name: CPU-reachable suites that CI never ran
        run: cd kernel && python -m pytest test_gptq_pack.py test_arena_moe_patch.py test_k3_oracle.py test_moonshot_gather.py test_mxfp4_arena_layout.py test_mxfp4_oracle.py test_mxfp4_provenance.py test_group_tiles_readonly.py test_mxfp4_interp.py test_mxfp4_gemv_b32.py test_mxfp4_e2m1_table.py test_mxfp4_v4.py test_triton_shim.py -q

      - name: hybrid CPU kernels (native build + exact-tree parity)
        # PYTHONPATH carries the repo root so gnf4_native imports from the
        # tree, and GNF4_REQUIRE_NATIVE turns an unavailable native build
        # into a FAILURE — without both, every @needs_native test skipped
        # and this gate was green about nothing (Bugbot)
        env:
          GNF4_REQUIRE_NATIVE: "1"
        run: cd kernel && PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest test_cpu_grouped.py -q

      # The GPU-labelled files. `_NOT_IN_CI` excluded these by FILE while the
      # skip markers inside them are per TEST, so 57 CPU-reachable tests rode
      # along into the exclusion and CI never ran them -- including the arena
      # suites that were the only check on #74-#77. Running the files here means
      # the device-bound tests skip (legibly, with their own reasons) and the
      # CPU-reachable ones execute. The gap cannot recur, because nothing is
      # excluded by file any more.
      - name: GPU-labelled files, for the CPU-reachable tests inside them
        run: cd kernel && python -m pytest test_arena_equivalence.py test_arena_experts.py test_mxfp4_qlora.py test_mxfp4_residency.py test_nf4_qlora_grad.py test_nvme_residency.py test_cold_reclaimable.py test_cold_cpu_view.py test_cold_cpu_view_direct.py test_cold_deadline.py test_reuse_profile.py test_vram_slots.py test_dev_row_cache.py test_row_pool.py test_segmented_pool.py test_fp8_kv.py test_fp8_kv_append.py test_fp8_paged_attn.py test_nf4_grouped.py test_mxfp4_grouped.py test_mxfp4_pipelined.py test_eids_forms.py test_arena_capture_semantics.py test_offsets_2gib.py test_instrument_gate.py test_dispatch_counts.py test_k12_census.py test_m3_defaults.py -q

      # Harness schedule logic (bench/phase1) — pure functions, no GPU. The
      # e2e driver's burn-in plan is the registered remedy for the ten-run
      # first-mode drift; this keeps a refactor from silently dropping it.
      - name: harness unit tests
        run: cd bench/phase1 && python -m pytest test_plan_modes.py -q

      - name: packaging allowlist + test-wiring guard
        run: cd kernel && python -m pytest test_packaging_covers_kernel.py test_check_readme_links.py test_check_scripts.py -q

  wheel-smoke:
    # Built-artifact gate: the README's promised import surface must equal the
    # wheel's importable surface (scripts/wheel_smoke.py is the hardcoded
    # mirror of the Install comment). Runs from /tmp so imports resolve from
    # the installed wheel, never the repo tree. Plus the link check with the
    # release tag mapped to main (the tag exists only at release time).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build
        run: |
          python -m pip install --quiet --upgrade pip build
          python -m build
          python scripts/check_wheel_sources.py dist/*.whl
      - name: install wheel into clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl \
            torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: import battery + CPU micros (from the wheel)
        run: |
          cp scripts/wheel_smoke.py /tmp/
          cd /tmp && ./venv/bin/python wheel_smoke.py
      - name: README link check (tag mapped to this tree pre-release)
        env:
          # ~40 unauthenticated HEADs from a shared Actions IP get throttled. The
          # script reuses one connection per host (the actual fix) and retries
          # transient answers only — never a 404.
          GITHUB_TOKEN: ${{ github.token }}
        # map to the PR head / pushed SHA, not main — a PR that ADDS a
        # README-linked file must validate against its own tree (Bugbot,
        # e4b PR #31; same job pattern here).
        run: |
          TAG=$(python -c "import tomllib; print('v'+tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          REF="${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/check_readme_links.py --map-ref "$TAG" "$REF"

  discoverability:
    # CPU-only, deterministic: the machine-readable contracts and the
    # packaging metadata. Nothing here imports the kernels.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the change-impact check diffs against the
          # PR base, and the manifest check compares every consumer floor to
          # the latest released tag (kernel-first invariant).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: capability contract (schema, pyproject, source symbols, claims, install routes)
        run: python scripts/check_capabilities.py
      - name: system manifest (names, kernel-first floors vs pyproject and tags, evidence vocabulary, capability ownership)
        run: python scripts/check_system_manifest.py
      - name: version statements in the current docs agree with pyproject and the manifest's current record
        run: python scripts/check_dependency_floor.py
      - name: change-impact contract on pull requests (the companions this diff is missing)
        if: github.event_name == 'pull_request'
        run: python scripts/check_change_impact.py --base ${{ github.event.pull_request.base.sha }}
      - name: discovery contract (queries -> pages -> concepts, canonical install, limitations; BM25 floor)
        # --bm25-min-top1 33 is the measured baseline (35/44 on this corpus;
        # 27/36 before the eight agent-perspective queries and the orientation
        # corpus were added) minus a two-query margin. A failure names the
        # queries that stopped ranking first. A local proxy over the corpus,
        # not a ranking claim, and never evidence of LLM discoverability.
        run: python scripts/check_discovery_contract.py --bm25 --bm25-min-top1 33
      - name: llms bundle is current
        run: python scripts/build_llms_bundle.py --check
      - name: solution-page code blocks parse (python) and every local link resolves
        run: python scripts/check_docs_examples.py --root .
      - name: build sdist + wheel, twine check, METADATA assertions
        run: |
          python -m pip install --quiet --upgrade pip build twine
          python -m build
          python scripts/check_wheel_sources.py dist/*.whl
          python -m twine check dist/*
          python scripts/check_wheel_metadata.py dist/*.whl
