[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grouped-nf4-gemm"
version = "0.8.0"
description = "Fused grouped GEMM on bitsandbytes NF4-packed weights with host streaming, on consumer GPUs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Jordan Anderson" }]
dependencies = [
    # The floor accepts PRE-RELEASES on purpose. Under PEP 440 a dev build
    # sorts BELOW its own release -- "2.8.0.dev20250319" does NOT satisfy
    # ">=2.8" -- so a plain ">=2.8" makes pip treat every nightly/dev CUDA
    # image as unsatisfied and install a fresh stable torch OVER it. That
    # silently swaps the torch a working image was built around and orphans
    # the torchvision/torchaudio pinned to it, which then fail at import
    # ("operator torchvision::nms does not exist"). Observed on the RunPod
    # pytorch:2.8.0-cu128 image: installing this package moved torch
    # 2.8.0.dev+cu128 -> 2.13.0+cu130 and broke the environment's transformers
    # stack. ">=2.8.0.dev0" is satisfied by those builds, so pip leaves a
    # working torch alone.
    "torch>=2.8.0.dev0",
    # Triton has NO macOS/Windows distribution, and an unconditional pin made
    # `pip install grouped-nf4-gemm` impossible there -- including for the
    # pure-torch surface (provenance verifier, NVMe arena bake/verify) that has
    # no CUDA in it at all. The published distribution claim is "bake locally,
    # check your manifest against a published one", which is exactly a laptop
    # task. torch itself marks its own triton dep this way.
    "triton>=3.4; platform_system == 'Linux'",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://cerinamroth.com/ml/grouped-nf4-gemm/"
Source = "https://github.com/pjordanandrsn/grouped-nf4-gemm"
Receipts = "https://github.com/pjordanandrsn/grouped-nf4-gemm/tree/main/kernel"

[tool.pytest.ini_options]
markers = [
    # Unregistered, this emitted PytestUnknownMarkWarning on every run -- noise
    # that makes a real warning easy to miss. The test it decorates self-gates on
    # $K3_SNAPSHOT, so the mark is for selection (-m "not network"), not skipping.
    "network: touches a real released snapshot or the network; opt-in via env",
]

[tool.setuptools]
package-dir = { "" = "kernel" }
py-modules = [
    "nf4_grouped", "nf4_pack_ref", "host_gather",
    "mxfp4_pack_ref", "mxfp4_grouped", "mxfp4_loader", "mxfp4_pipelined",
    "mxfp4_qlora", "mxfp4_native_load", "moonshot_gather", "arena_experts", "arena_moe_patch", "verify_provenance",
    "run_mxfp4_20b_qlora", "gate_native_load_20b",
    "nvme_arena", "nvme_bake_nf4", "nvme_reader",
    # 0.3.0's headline surface. These were absent from this allowlist, so the
    # NVMe residency tier and the MXFP4 residency engine -- K3_RESIDENCY_KINDS,
    # fuse_gate_up_segments, Mxfp4NvmeResidency -- shipped in the CHANGELOG and
    # NOT in the wheel. tests/test_packaging_covers_kernel.py now fails if any
    # non-test kernel/*.py is missing here.
    "mxfp4_residency", "nvme_residency",
    "nf4_qlora",
    # The GGUF k-quant lane (Glimmer-era): reader + reference decoders.
    "gguf_reader", "kquant_ref",
]
